{id:"simplex",title:"Simplex method",level:5,kind:"Linear programming",status:"Runnable teaching lab",
 summary:"The simplex method solves linear programs by moving along the edges of the feasible polytope from one vertex to a better neighbour. Exponential worst case but very fast in practice.",
 mental:"Walk along the edges of a polygon towards the best corner",
 mentalText:"Start at a feasible vertex. Move to an adjacent vertex with better objective. Repeat until no improving move exists.",
 steps:["Convert the LP to standard form with slack variables.","Find an initial basic feasible solution.","Choose an entering variable (with positive reduced cost for max).","Choose a leaving variable by the ratio test.","Pivot and repeat until optimal."],
 pseudo:"simplex(c, A, b):\n  # maximize c^T x subject to Ax <= b, x >= 0\n  tableau = build_tableau(c, A, b)\n  while True:\n    # choose entering variable\n    j = index with positive reduced cost\n    if none: break   # optimal\n    # ratio test for leaving variable\n    i = argmin(b[i] / tableau[i][j] for tableau[i][j] > 0)\n    if no such i: unbounded\n    pivot(tableau, i, j)\n  return tableau\n\nTime: exponential worst case (Klee-Minty cube)\npractical: very fast, usually O(m + n) iterations\n\nVariants:\n  two-phase simplex: find initial BFS\n  dual simplex: maintain dual feasibility\n  revised simplex: matrix representation",
 uses:"Operations research, scheduling, network flow, game theory, machine learning (SVM).",
 strength:"Fast in practice. Well understood.",
 limits:"Exponential worst case. Numerical issues on ill-conditioned problems.",
 pitfall:"Degenerate pivots can cause cycling. Bland's rule or lexicographic pivoting prevents it.",
 question:"What is the geometric interpretation of a simplex pivot?",
 answer:"Moving to an adjacent vertex of the feasible polytope. Each pivot improves the objective.",
 demo:"simplex",sample:"3 2\n1 1 4\n1 3 6",refs:[
  ["Dantzig, Linear Programming and Extensions, Princeton 1963","https://press.princeton.edu/books/paperback/9780691059136/linear-programming-and-extensions"],
  ["Klee and Minty, How good is the simplex algorithm?, 1972","https://doi.org/10.1016/B978-0-12-358350-9.50014-0"],
  ["Bertsimas and Tsitsiklis, Introduction to Linear Optimization, Athena 1997","https://www.athenasc.com/linoptbook.html"]]},
{id:"dual-simplex",title:"Dual simplex and duality",level:5,kind:"Linear programming",status:"Concept lesson",
 summary:"Every LP has a dual with related structure. The dual simplex maintains dual feasibility and pivots toward primal feasibility. Strong duality says the optimal values are equal.",
 mental:"Solve the same problem from the other side",
 mentalText:"Primal: maximize c'x subject to Ax <= b. Dual: minimize b'y subject to A'y >= c. The optimal values are equal when both are feasible.",
 steps:["Write the primal.","Write the dual.","Apply weak duality for bounds.","Use strong duality for optimality certificates."],
 pseudo:"Primal (standard form):\n  maximize c^T x\n  subject to Ax <= b, x >= 0\n\nDual:\n  minimize b^T y\n  subject to A^T y >= c, y >= 0\n\nWeak duality: c^T x <= b^T y for any feasible x, y\nStrong duality: optimal values are equal\nComplementary slackness:\n  x_i > 0 implies dual constraint i is tight\n  y_j > 0 implies primal constraint j is tight\n\nApplications:\n  shadow prices\n  sensitivity analysis\n  certificate of optimality\n  min-cost flow and max-flow duality",
 uses:"Sensitivity analysis, verification of optimality, algorithms via the dual (dual simplex).",
 strength:"Provides optimality certificates and economic interpretations.",
 limits:"Duality gap only exists in integer programming, not in LP.",
 pitfall:"The dual of an LP depends on its exact form (standard, canonical, equality). Getting the form wrong gives the wrong dual.",
 question:"What is the dual of 'maximize 3x + 2y subject to x + y <= 4, x + 3y <= 6'?",
 answer:"Minimize 4u + 6v subject to u + v >= 3, u + 3v >= 2, u, v >= 0.",
 demo:"none",sample:"",refs:[
  ["von Neumann, On a problem in the theory of games, 1928 (duality)","https://en.wikipedia.org/wiki/Dual_linear_program"],
  ["Dantzig, Linear Programming and Extensions","https://press.princeton.edu/books/paperback/9780691059136/linear-programming-and-extensions"],
  ["Bertsimas and Tsitsiklis, Introduction to Linear Optimization, Chapters 4-5","https://www.athenasc.com/linoptbook.html"]]},
{id:"interior-point",title:"Interior point methods",level:5,kind:"Linear programming",status:"Concept lesson",
 summary:"Interior point methods traverse the interior of the feasible region instead of the boundary. They solve LP and convex problems in polynomial time with strong practical performance.",
 mental:"Cut through the interior instead of walking the boundary",
 mentalText:"Follow a central path through the interior. Each step stays inside the feasible region and gets closer to the optimum.",
 steps:["Start at a strictly feasible point.","Compute the Newton direction for the barrier problem.","Take a step along the direction.","Reduce the barrier parameter.","Repeat until the solution is accurate."],
 pseudo:"primal-dual interior point (conceptual):\n  x, y, s = initial strictly feasible\n  mu = duality gap\n  while mu > eps:\n    # compute Newton direction for the KKT system\n    direction = solve_newton_system(x, y, s, mu)\n    # line search to stay feasible\n    alpha = max_step(direction, x, s)\n    x += alpha * dx\n    y += alpha * dy\n    s += alpha * ds\n    mu *= reduction_factor\n  return x, y, s\n\nTime: O(n^3) per iteration, O(sqrt(n)) iterations\nWorst case polynomial: O(n^3.5 L) for LP\n\nUsed in:\n  MOSEK, Gurobi, CPLEX, Mosek, CVXOPT\n  CVXPY, scipy.optimize.linprog (interior-point option)",
 uses:"Large-scale LP, quadratic programming, semidefinite programming, convex optimization.",
 strength:"Polynomial time. Often faster than simplex on large LPs. Handles sparse problems well.",
 limits:"Not as good at warm-starting as simplex. Sensitive to scaling.",
 pitfall:"Must start strictly inside. Two-phase initialization or self-dual embedding is needed.",
 question:"Why does interior point cross the interior instead of the boundary?",
 answer:"The central path through the interior converges to the optimal vertex without visiting every vertex. This gives polynomial complexity.",
 demo:"none",sample:"",refs:[
  ["Karmarkar, A new polynomial-time algorithm for linear programming, Combinatorica 1984","https://doi.org/10.1007/BF02579150"],
  ["Nesterov and Nemirovskii, Interior-Point Polynomial Algorithms in Convex Programming, SIAM 1994","https://epubs.siam.org/doi/book/10.1137/1.9781611970791"],
  ["Wright, Primal-Dual Interior-Point Methods, SIAM 1997","https://epubs.siam.org/doi/book/10.1137/1.9781611971453"]]},
{id:"ellipsoid",title:"Ellipsoid method",level:5,kind:"Linear programming",status:"Concept lesson",
 summary:"The ellipsoid method solves LP in polynomial time by maintaining an ellipsoid that always contains the optimum. It was the first polynomial-time LP algorithm, though slower than simplex in practice.",
 mental:"Shrink an ellipsoid around the answer",
 mentalText:"Start with a huge ellipsoid containing the feasible region. Cut it with a hyperplane through the centre. Compute the minimum-volume ellipsoid containing the good half. Repeat.",
 steps:["Start with an ellipsoid containing the optimal solution.","Check if the centre is feasible and optimal.","Cut the ellipsoid with a separating hyperplane.","Compute the new minimum-volume ellipsoid.","Repeat until the ellipsoid is small enough."],
 pseudo:"ellipsoid(c, A, b):\n  E = initial large ellipsoid\n  while volume(E) > epsilon:\n    x = center(E)\n    if x is feasible and optimal: return x\n    else:\n      # find a hyperplane separating x from the feasible set\n      find a in rows of A such that a^T x > b\n      E = minimum_volume_ellipsoid_containing(\n        E intersect {y : a^T y <= b}\n      )\n\nTime: polynomial in input size\nWeakness: high constant factor\nUsed theoretically to prove P membership of LP",
 uses:"Theoretical complexity of LP, teaching polynomial-time algorithms, combinatorial optimization (as a tool).",
 strength:"Polynomial time. Proves LP is in P.",
 limits:"Very slow in practice. Numerically delicate. Superseded by interior point.",
 pitfall:"The volume shrinks geometrically, but the constant per iteration is huge. For practical LP use simplex or interior point.",
 question:"Why is the ellipsoid method important despite being slow?",
 answer:"It was the first polynomial-time algorithm for linear programming, settling the theoretical complexity of LP and inspiring interior point methods.",
 demo:"none",sample:"",refs:[
  ["Khachiyan, A polynomial algorithm in linear programming, Soviet Math. Doklady 1979","https://www.sciencedirect.com/science/article/pii/0041555379902607"],
  ["Grötschel, Lovász, Schrijver, Geometric Algorithms and Combinatorial Optimization, Springer 1988","https://link.springer.com/book/10.1007/978-3-642-78240-4"],
  ["Schrijver, Theory of Linear and Integer Programming, Wiley 1986","https://www.wiley.com/en-us/Theory+of+Linear+and+Integer+Programming-p-9780471982326"]]},
{id:"branch-cut",title:"Branch-and-cut",level:5,kind:"Integer programming",status:"Concept lesson",
 summary:"Branch-and-cut combines branch and bound with cutting planes. Cuts tighten the LP relaxation to give better bounds and prune more branches.",
 mental:"Add constraints that cut off fractional solutions",
 mentalText:"Solve the LP relaxation. If the optimum is fractional, add a cut that removes it but keeps all integer solutions. Repeat until the LP gives an integer or branching is needed.",
 steps:["Solve the LP relaxation.","If integer, done.","Otherwise, find a valid inequality (cut) violated by the current solution.","Add the cut and re-solve.","If no cut helps, branch on a fractional variable."],
 pseudo:"branch_and_cut(MIP):\n  node = root\n  best_integer = None\n  queue = [node]\n  while queue:\n    node = queue.pop_best_bound()\n    lp_solution = solve_lp_relaxation(node)\n    if lp_solution is integer:\n      if better than best_integer: best_integer = lp_solution\n      continue\n    if lp_bound worse than best_integer: continue\n    cuts = find_cuts(lp_solution)\n    if cuts:\n      node = add_cuts(node, cuts)\n      queue.append(node)\n    else:\n      left, right = branch(node, fractional_variable)\n      queue.append(left); queue.append(right)\n  return best_integer\n\nCut families:\n  Gomory cuts (general)\n  Cover cuts (knapsack)\n  Clique cuts (set packing)\n  Flow cover cuts (fixed-charge)\n\nUsed in Gurobi, CPLEX, SCIP, CBC.",
 uses:"Mixed-integer programming, scheduling, network design, logistics, portfolio optimization.",
 strength:"State of the art for practical MIP. Handles large problems with the right cuts.",
 limits:"Cut selection is heuristic. Implementation is complex.",
 pitfall:"Too many cuts slow down each LP solve. Must balance cut generation and solve time.",
 question:"What is the difference between branch-and-bound and branch-and-cut?",
 answer:"Branch-and-cut adds cutting planes at each node to tighten the LP bound before branching. Branch-and-bound only uses the LP bound as-is.",
 demo:"none",sample:"",refs:[
  ["Padberg and Rinaldi, A branch-and-cut algorithm for the resolution of large-scale symmetric traveling salesman problems, SIAM Review 1991","https://doi.org/10.1137/1033004"],
  ["Cornuéjols, Valid inequalities for mixed integer linear programs, Math. Programming 2008","https://doi.org/10.1007/s10107-007-0107-7"],
  ["Achterberg, SCIP: Solving constraint integer programs, Math. Programming Computation 2009","https://doi.org/10.1007/s12532-008-0001-1"]]},

{id:"min-cost-flow",title:"Minimum cost flow",level:5,kind:"Network optimization",status:"Concept lesson",
 summary:"Send a given amount of flow from sources to sinks at minimum cost. Extends max flow by adding per-edge costs. Solvable in polynomial time with successive shortest paths or cost-scaling.",
 mental:"Route flow to minimize total transportation cost",
 mentalText:"Each edge has a capacity and a per-unit cost. Push flow along the cheapest available paths until the required amount is sent.",
 steps:["Model as a directed graph with capacities and costs.","Use successive shortest paths: repeatedly find the cheapest path and push flow.","Or use cost-scaling / network simplex."],
 pseudo:"successive_shortest_paths(G, source, sink, required_flow):\n  flow = 0\n  total_cost = 0\n  while flow < required_flow:\n    # find shortest path in the residual graph by cost\n    dist, prev = dijkstra_with_potentials(G)\n    if sink not reachable: break\n    # push as much as possible\n    amount = min(residual[e] for e in path_to_sink)\n    amount = min(amount, required_flow - flow)\n    for e in path_to_sink:\n      residual[e] -= amount\n      residual[reverse(e)] += amount\n    flow += amount\n    total_cost += amount * dist[sink]\n  return flow, total_cost\n\nTime:\n  successive shortest paths: O(F * (E + V log V))\n  cost-scaling: O(V^2 E log(VC))\n  network simplex: very fast in practice",
 uses:"Transportation, logistics, assignment, matching with weights, image segmentation.",
 strength:"Polynomial. Models many real problems.",
 limits:"Some variants (min-cost max-flow with additional constraints) are NP-hard.",
 pitfall:"Negative costs need potentials or Bellman-Ford. Plain Dijkstra does not handle negative edges.",
 question:"How does min-cost flow differ from max flow?",
 answer:"Max flow asks for the largest possible flow. Min-cost flow asks for the cheapest way to send a specified amount.",
 demo:"none",sample:"",refs:[
  ["Ahuja, Magnanti, Orlin, Network Flows: Theory, Algorithms, and Applications, Prentice Hall 1993","https://www.pearson.com/en-us/subject-catalog/p/network-flows-theory-algorithms-and-applications/P200000003269"],
  ["Goldberg and Tarjan, Finding minimum-cost circulations by successive approximation, Math. of OR 1990","https://doi.org/10.1287/moor.15.3.430"],
  ["cp-algorithms.com, Min-cost flow","https://cp-algorithms.com/graph/min_cost_flow.html"]]},
{id:"assignment",title:"Assignment problem",level:4,kind:"Combinatorial optimization",status:"Runnable teaching lab",
 summary:"Assign n workers to n jobs minimizing total cost. Solvable in polynomial time with the Hungarian algorithm (O(n³)) or as a min-cost flow problem.",
 mental:"Match workers to jobs at minimum cost",
 mentalText:"Build a bipartite graph with costs. Find a perfect matching of minimum total cost.",
 steps:["Build cost matrix.","Reduce rows and columns to create zeros.","Find a maximum matching of zeros.","If perfect, done. Otherwise, adjust the cost matrix and repeat."],
 pseudo:"hungarian_algorithm(cost):\n  n = len(cost)\n  u = [0] * (n + 1)\n  v = [0] * (n + 1)\n  p = [0] * (n + 1)\n  way = [0] * (n + 1)\n  for i in range(1, n + 1):\n    p[0] = i\n    j0 = 0\n    minv = [infinity] * (n + 1)\n    used = [False] * (n + 1)\n    while True:\n      used[j0] = True\n      i0 = p[j0]\n      delta = infinity\n      j1 = 0\n      for j in range(1, n + 1):\n        if not used[j]:\n          cur = cost[i0 - 1][j - 1] - u[i0] - v[j]\n          if cur < minv[j]:\n            minv[j] = cur\n            way[j] = j0\n          if minv[j] < delta:\n            delta = minv[j]\n            j1 = j\n      for j in range(n + 1):\n        if used[j]:\n          u[p[j]] += delta\n          v[j] -= delta\n        else:\n          minv[j] -= delta\n      j0 = j1\n      if p[j0] == 0:\n        break\n    while True:\n      j1 = way[j0]\n      p[j0] = p[j1]\n      j0 = j1\n      if j0 == 0: break\n  return -v[0]\n\nTime: O(n^3)\nSpace: O(n^2)",
 uses:"Job scheduling, resource allocation, personnel assignment, image matching.",
 strength:"Polynomial time. Exact.",
 limits:"Requires equal numbers of workers and jobs. Balanced variant for unequal.",
 pitfall:"Hungarian algorithm assumes a square cost matrix. Pad with dummy rows or columns for rectangular problems.",
 question:"What is the assignment problem's relationship to min-cost flow?",
 answer:"Assignment is a special case of min-cost flow with source-to-worker edges of capacity 1, worker-to-job edges with cost, and job-to-sink edges of capacity 1.",
 demo:"assignment",sample:"3\n9 2 7\n6 4 3\n5 8 1",refs:[
  ["Kuhn, The Hungarian method for the assignment problem, Naval Research Logistics 1955","https://doi.org/10.1002/nav.3800020109"],
  ["Munkres, Algorithms for the assignment and transportation problems, J. SIAM 1957","https://doi.org/10.1137/0105003"],
  ["cp-algorithms.com, Hungarian algorithm","https://cp-algorithms.com/graph/hungarian-algorithm.html"]]},
{id:"matching",title:"Matching theory",level:5,kind:"Combinatorial optimization",status:"Concept lesson",
 summary:"A matching pairs vertices so no vertex is used twice. Maximum matching in bipartite graphs is polynomial (Hopcroft-Karp). In general graphs, Edmonds' blossom algorithm handles odd cycles.",
 mental:"Pair up as many vertices as possible",
 mentalText:"Greedily pair adjacent vertices. Augment the matching with alternating paths to increase its size. Repeat until no augmenting path exists.",
 steps:["Start with empty matching.","Find an augmenting path (alternating between unmatched and matched edges, starting and ending unmatched).","Flip the matching along the path.","Repeat."],
 pseudo:"bipartite_matching (Hopcroft-Karp):\n  match_left = {}\n  match_right = {}\n  while bfs_finds_augmenting_paths():\n    for each unmatched left vertex:\n      if dfs_finds_path(u): continue\n  return matching\n\nGeneral graph (Edmonds blossom):\n  when DFS meets an odd cycle, contract it into a 'blossom'\n  continue searching in the contracted graph\n  expand blossoms when constructing the augmenting path\n\nTime:\n  bipartite: O(E * sqrt(V))\n  general: O(V^3) with blossom\n\nApplications:\n  assignment, scheduling, marriage problem, kidney exchange.",
 uses:"Scheduling, resource allocation, kidney exchange, stable marriage (Gale-Shapley).",
 strength:"Polynomial. Edmonds' algorithm handles general graphs.",
 limits:"Weighted matching is harder. Maximum matching in hypergraphs is NP-hard.",
 pitfall:"Augmenting path algorithms must flip the matching correctly. Missing an augmenting path can stop early with a suboptimal matching.",
 question:"When does a matching have maximum cardinality?",
 answer:"When no augmenting path exists. This is Berge's theorem.",
 demo:"none",sample:"",refs:[
  ["Edmonds, Paths, trees, and flowers, Canadian J. Math 1965","https://doi.org/10.4153/CJM-1965-045-4"],
  ["Hopcroft and Karp, An n^2.5 algorithm for maximum matchings in bipartite graphs, SIAM J. Comput. 1973","https://doi.org/10.1137/0202019"],
  ["Lovász and Plummer, Matching Theory, AMS 2009","https://bookstore.ams.org/chel-367-h"]]},
{id:"facility-location",title:"Facility location",level:5,kind:"Combinatorial optimization",status:"Concept lesson",
 summary:"Decide where to open facilities so that all clients are served at minimum total cost (opening cost plus service cost). NP-hard in general. Approximation algorithms exist.",
 mental:"Choose sites to serve all customers cheaply",
 mentalText:"Each facility has an opening cost. Each customer has a service cost to each facility. Minimize the sum of opening and service costs.",
 steps:["Model as a MIP or as a primal-dual problem.","Solve exactly for small instances with branch-and-cut.","Or use approximation algorithms (LP rounding, primal-dual, local search)."],
 pseudo:"Uncapacitated Facility Location (UFL):\n  minimize sum_{j in F} f_j y_j + sum_{i in C} sum_{j in F} c_ij x_ij\n  subject to:\n    sum_{j} x_ij = 1 for all i (each client assigned)\n    x_ij <= y_j for all i, j (only open facilities serve)\n    y_j, x_ij in {0, 1}\n\nApproximation algorithms:\n  Jain-Vazirani primal-dual: 1.61-approximation\n  LP rounding (Shmoys-Tardos-Aardal): 3-approximation and improvements\n  Local search: (5 + eps)-approximation\n\nFor metric instances, best known is 1.488 (Li 2013).",
 uses:"Warehouse location, cell tower placement, retail site selection, logistics.",
 strength:"Well-studied approximation guarantees.",
 limits:"NP-hard. Exact solution impractical for large instances.",
 pitfall:"Capacitated facility location is significantly harder than uncapacitated. Different algorithms needed.",
 question:"Why is facility location NP-hard?",
 answer:"It contains set cover as a special case. Set cover is NP-hard, so facility location is too.",
 demo:"none",sample:"",refs:[
  ["Cornuéjols, Nemhauser, Wolsey, The uncapacitated facility location problem, 1990","https://doi.org/10.1007/978-1-4613-1463-6_6"],
  ["Shmoys, Tardos, Aardal, Approximation algorithms for facility location problems, STOC 1997","https://doi.org/10.1145/258533.258579"],
  ["Li, A 1.488 approximation algorithm for the uncapacitated facility location problem, Information and Computation 2013","https://doi.org/10.1016/j.ic.2013.11.001"]]},
{id:"set-cover",title:"Set cover and primal-dual",level:5,kind:"Approximation",status:"Concept lesson",
 summary:"Given a universe and a family of sets, choose the minimum number of sets to cover the universe. NP-hard. Greedy gives an O(log n) approximation, which is optimal unless P = NP.",
 mental:"Cover all elements with the fewest sets",
 mentalText:"Greedily pick the set that covers the most uncovered elements. Repeat until all elements are covered.",
 steps:["Mark all elements uncovered.","Repeatedly pick the set that covers the most uncovered elements.","Mark those elements covered.","Repeat until all covered."],
 pseudo:"greedy_set_cover(universe, sets):\n  uncovered = set(universe)\n  chosen = []\n  while uncovered:\n    best = max(sets, key=lambda s: len(s & uncovered))\n    chosen.append(best)\n    uncovered -= best\n  return chosen\n\nApproximation ratio: H(n) = 1 + 1/2 + ... + 1/n = O(log n)\n\nTightness:\n  no polynomial algorithm can do better than (1 - o(1)) ln n\n  unless P = NP.\n\nPrimal-dual alternative:\n  construct dual variables that drive the choice\n  often gives better constants in practice\n\nWeighted set cover:\n  greedy picks the set minimizing cost / newly covered\n  approximation O(log n) still holds",
 uses:"Test selection, sensor placement, feature selection, network monitoring.",
 strength:"Simple greedy algorithm. Logarithmic approximation is essentially optimal.",
 limits:"Cannot do better than log n in polynomial time unless P = NP.",
 pitfall:"The greedy ratio is log n, not constant. For a small constant approximation, use a different problem (e.g., vertex cover has 2-approx).",
 question:"What is the best known approximation ratio for set cover?",
 answer:"O(log n) is achievable and is essentially tight. Unless P = NP, no polynomial algorithm can achieve o(log n).",
 demo:"none",sample:"",refs:[
  ["Johnson, Approximation algorithms for combinatorial problems, JCSS 1974","https://doi.org/10.1016/S0022-0000(74)80044-9"],
  ["Lovász, On the ratio of optimal integral and fractional covers, Discrete Math 1975","https://doi.org/10.1016/0012-365X(75)90058-8"],
  ["Feige, A threshold of ln n for approximating set cover, JACM 1998","https://doi.org/10.1145/285055.285059"]]},

{id:"gd",title:"Gradient descent",level:2,kind:"Gradient method",status:"Runnable teaching lab",
 summary:"Gradient descent minimizes a differentiable function by repeatedly moving opposite the gradient. Simple, widely used, and the basis for many optimization methods.",
 mental:"Walk downhill in the steepest direction",
 mentalText:"Compute the gradient. Take a small step opposite the gradient. Repeat.",
 steps:["Choose a starting point.","Compute the gradient.","Step: x_new = x - learning_rate * gradient.","Repeat until convergence."],
 pseudo:"gradient_descent(f, grad_f, x0, lr, tolerance):\n  x = x0\n  while True:\n    g = grad_f(x)\n    if norm(g) < tolerance: break\n    x = x - lr * g\n  return x\n\nConvergence:\n  convex smooth: O(1/k)\n  strongly convex: linear rate O((1 - mu/L)^k)\n\nLearning rate:\n  too small: slow convergence\n  too large: divergence or oscillation\n  lr ~ 1/L for L-smooth functions\n\nVariants:\n  line search (exact or backtracking)\n  Barzilai-Borwein step size\n  stochastic gradient descent",
 uses:"Training neural networks, logistic regression, matrix factorization, physics simulation.",
 strength:"Simple. Scales to high dimensions.",
 limits:"Sensitive to learning rate and conditioning. Slow on ill-conditioned problems.",
 pitfall:"A constant learning rate rarely works for all problems. Use line search or a schedule.",
 question:"What is the optimal learning rate for a quadratic with curvature L?",
 answer:"1/L for the steepest descent bound. In practice, tune empirically or use line search.",
 demo:"gd",sample:"0.1\n20",refs:[
  ["Cauchy, Méthode générale pour la résolution des systèmes d'équations simultanées, 1847","https://gallica.bnf.fr/ark:/12148/bpt6k2982c"],
  ["Nocedal and Wright, Numerical Optimization, Springer 2006","https://link.springer.com/book/10.1007/978-0-387-40065-5"],
  ["Boyd and Vandenberghe, Convex Optimization, Cambridge 2004","https://web.stanford.edu/~boyd/cvxbook/"]]},
{id:"sgd",title:"Stochastic gradient descent",level:3,kind:"Gradient method",status:"Runnable teaching lab",
 summary:"SGD estimates the gradient with a random mini-batch instead of the full dataset. Cheap per step, noisy, and often faster to reach a good region than full batch.",
 mental:"Use a random sample of the data for each step",
 mentalText:"Instead of computing the exact gradient, compute it on a small batch. The noise averages out over many steps.",
 steps:["Shuffle the data.","Take a mini-batch.","Compute the gradient on the batch.","Update the parameters.","Repeat for each batch."],
 pseudo:"sgd(f_i, x0, lr, batch_size, epochs):\n  x = x0\n  for epoch in range(epochs):\n    shuffle(data)\n    for batch in batches(data, batch_size):\n      g = mean(grad_fi(x) for i in batch)\n      x = x - lr * g\n  return x\n\nVariance of gradient estimate: sigma^2 / batch_size\nLarger batch: lower variance, more work per step\n\nLearning rate schedules:\n  step decay, cosine, warmup\n\nVariants:\n  SGD with momentum\n  Adam, RMSProp, AdaGrad (adaptive step size)\n\nMini-batch is the standard in deep learning.",
 uses:"Training neural networks at scale, online learning, large-scale machine learning.",
 strength:"Cheap per step. Noise helps escape sharp minima.",
 limits:"Noisy convergence. Tuning learning rate and batch size is critical.",
 pitfall:"Without shuffling, batches correlate and the gradient is biased. Always shuffle per epoch.",
 question:"How does batch size affect SGD?",
 answer:"Larger batches give lower variance gradients but more work per step. There is a tradeoff between variance and cost.",
 demo:"sgd",sample:"0.1\n100\n10",refs:[
  ["Robbins and Monro, A stochastic approximation method, Annals of Math Stat 1951","https://doi.org/10.1214/aoms/1177729586"],
  ["Bottou, Large-scale machine learning with stochastic gradient descent, COMPSTAT 2010","https://doi.org/10.1007/978-3-7908-2604-3_16"],
  ["Goodfellow, Bengio, Courville, Deep Learning, Chapter 8","https://www.deeplearningbook.org/"]]},
{id:"momentum",title:"Momentum and Nesterov acceleration",level:3,kind:"Gradient method",status:"Runnable teaching lab",
 summary:"Momentum accumulates past gradients to smooth updates. Nesterov uses a look-ahead gradient to correct before overshooting. Both accelerate convergence in ravines.",
 mental:"A ball rolling down a hill gathering speed",
 mentalText:"Gradient descent takes small steps. Momentum accumulates the direction of the steps, so it moves faster in consistent directions.",
 steps:["Momentum: v = beta * v + g; x = x - lr * v.","Nesterov: compute gradient at x - lr * beta * v, then update v."],
 pseudo:"Classical momentum:\n  v = beta * v + grad_f(x)\n  x = x - lr * v\n\nNesterov accelerated gradient:\n  y = x - lr * beta * v\n  v = beta * v + grad_f(y)\n  x = x - lr * v\n\nbeta typically 0.9\n\nFor smooth convex functions:\n  Nesterov: O(1/k^2) convergence\n  Plain GD: O(1/k)\n\nFor strongly convex:\n  Nesterov: linear with better constant\n\nMomentum helps in ravines:\n  gradient oscillates across the ravine\n  momentum averages out the oscillations\n  moves faster along the ravine",
 uses:"Deep learning training, any gradient descent that needs a speedup.",
 strength:"Faster convergence with little extra cost.",
 limits:"Extra hyperparameter (beta). May overshoot if tuned poorly.",
 pitfall:"beta too large causes oscillation. beta too small gives no speedup.",
 question:"What is the intuition for why momentum helps in ravines?",
 answer:"The gradient along the ravine is small, but across it is large. Momentum averages out the oscillations across and accumulates progress along.",
 demo:"momentum",sample:"0.05\n50",refs:[
  ["Polyak, Some methods of speeding up the convergence of iteration methods, 1964","https://doi.org/10.1016/0041-5553(64)90137-5"],
  ["Nesterov, A method of solving a convex programming problem with convergence rate O(1/k^2), 1983","https://doi.org/10.1016/0041-5553(83)90074-5"],
  ["Sutskever et al., On the importance of initialization and momentum in deep learning, ICML 2013","https://dl.acm.org/doi/10.5555/3042817.3043064"]]},
{id:"newton",title:"Newton's method",level:4,kind:"Second-order method",status:"Runnable teaching lab",
 summary:"Newton's method uses second-order information (the Hessian) to take larger, more informed steps. Quadratic convergence near the optimum but expensive per step.",
 mental:"Use curvature to jump directly to the minimum of a quadratic approximation",
 mentalText:"Approximate the function by a quadratic. Jump to its minimum. Repeat.",
 steps:["Compute gradient g and Hessian H.","Solve H d = -g for the Newton direction d.","Update x = x + d.","Repeat."],
 pseudo:"newton_method(f, grad, hess, x0):\n  x = x0\n  while True:\n    g = grad(x)\n    H = hess(x)\n    d = solve(H, -g)\n    x = x + d\n    if norm(g) < tolerance: break\n  return x\n\nConvergence:\n  quadratic near the optimum\n  requires a good starting point\n  may diverge if H is indefinite\n\nCost per iteration:\n  O(n^3) for the solve\n  O(n^2) storage for the Hessian\n\nPractical:\n  impractical for large n\n  replaced by quasi-Newton (BFGS, L-BFGS)\n\nModifications:\n  damped Newton: line search\n  trust region: bound the step size\n  Fisher scoring: use the expected Hessian",
 uses:"Small-scale convex optimization, logistic regression, MLE, curve fitting.",
 strength:"Very fast convergence near the optimum.",
 limits:"Requires the Hessian. Expensive per step. Divergence on non-convex problems.",
 pitfall:"Newton's method converges to a stationary point of the quadratic model, which may be a maximum or saddle if H is indefinite.",
 question:"Why is Newton's method quadratic near the optimum?",
 answer:"Near the optimum, the function is nearly quadratic. Newton finds the exact minimum of a quadratic in one step. The error shrinks quadratically.",
 demo:"newton",sample:"2",refs:[
  ["Newton, Method of fluxions, 1671 (published 1736)","https://en.wikipedia.org/wiki/Newton%27s_method"],
  ["Nocedal and Wright, Numerical Optimization, Chapter 3","https://link.springer.com/book/10.1007/978-0-387-40065-5"],
  ["Boyd and Vandenberghe, Convex Optimization, Section 9.5","https://web.stanford.edu/~boyd/cvxbook/"]]},
{id:"bfgs",title:"Quasi-Newton and BFGS",level:4,kind:"Second-order method",status:"Runnable teaching lab",
 summary:"Quasi-Newton methods approximate the Hessian from gradient differences. BFGS is the most successful. Gives superlinear convergence without the O(n²) Hessian cost.",
 mental:"Learn the curvature from how the gradient changes",
 mentalText:"Observe how the gradient changes when you move. Use this to update an approximation of the inverse Hessian. Take a Newton-like step.",
 steps:["Initialize B = I (inverse Hessian approximation).","Compute search direction d = -B g.","Line search for step size.","Update x = x + alpha * d.","Compute s = x_new - x_old, y = g_new - g_old.","Update B with the BFGS formula."],
 pseudo:"BFGS update:\n  B_new = (I - rho * s * y^T) B (I - rho * y * s^T) + rho * s * s^T\n  where rho = 1 / (y^T s)\n\nSteps:\n  initialize B = I\n  for k = 1, 2, ...:\n    d = -B * g_k\n    line search: alpha = argmin f(x_k + alpha * d)\n    x_{k+1} = x_k + alpha * d\n    s = x_{k+1} - x_k\n    y = g_{k+1} - g_k\n    if y^T s > 0:\n      update B with BFGS\n    if ||g_k|| < tol: break\n\nConvergence:\n  superlinear near the optimum\n  no Hessian needed\n\nCost:\n  O(n^2) per update and storage\n\nL-BFGS: limited memory, O(n) storage.",
 uses:"Medium-scale unconstrained optimization, MLE, curve fitting, variational inference.",
 strength:"No Hessian. Fast convergence.",
 limits:"O(n²) memory. Requires storing B.",
 pitfall:"The line search must satisfy the Wolfe conditions to keep B positive definite.",
 question:"How does BFGS approximate the Hessian without computing it?",
 answer:"From the secant equation B * s = y, where s is the step and y is the gradient change. The BFGS update enforces this while keeping B positive definite.",
 demo:"bfgs",sample:"2",refs:[
  ["Broyden, The convergence of a class of double-rank minimization algorithms, J. IMA 1970","https://doi.org/10.1093/imamat/6.1.76"],
  ["Fletcher, A new approach to variable metric algorithms, Computer Journal 1970","https://doi.org/10.1093/comjnl/13.3.317"],
  ["Nocedal and Wright, Numerical Optimization, Chapter 6","https://link.springer.com/book/10.1007/978-0-387-40065-5"]]},
{id:"lbfgs",title:"L-BFGS and large-scale quasi-Newton",level:5,kind:"Second-order method",status:"Concept lesson",
 summary:"L-BFGS approximates the BFGS update from a limited history of recent (s, y) pairs. O(n) memory and time per iteration, suitable for very high dimensions.",
 mental:"Use the last m updates to approximate the Hessian",
 mentalText:"Store the last m pairs of steps and gradient changes. Reconstruct the Hessian-vector product from these. Never form the full Hessian.",
 steps:["Keep history of the last m pairs (s_i, y_i).","Compute the product B v using the two-loop recursion.","Take the step in the direction -B g.","Update the history."],
 pseudo:"L-BFGS two-loop recursion:\n  q = g_k\n  for i in reversed(range(len(history))):\n    alpha_i = rho_i * s_i^T q\n    q = q - alpha_i * y_i\n  r = H0 * q   # H0 is a simple scaling, e.g. (s^T y) / (y^T y) * I\n  for i in range(len(history)):\n    beta = rho_i * y_i^T r\n    r = r + (alpha_i - beta) * s_i\n  return -r   # the search direction\n\nTime: O(m * n) per iteration\nSpace: O(m * n) for the history\n\nTypical m: 5 to 20\n\nUsed when n is large and the Hessian is expensive.",
 uses:"Large-scale machine learning, logistic regression, CRFs, deep learning (historically), scientific computing.",
 strength:"O(n) memory. Good convergence without the full Hessian.",
 limits:"Approximation quality degrades if m is too small or the problem is ill-conditioned.",
 pitfall:"The scaling of H0 should be adapted. A fixed scaling often hurts convergence.",
 question:"Why is L-BFGS preferred over BFGS for large problems?",
 answer:"BFGS stores and updates the full n×n inverse Hessian, which is O(n²) memory. L-BFGS stores only O(m n) history, where m is small (5 to 20).",
 demo:"none",sample:"",refs:[
  ["Nocedal, Updating quasi-Newton matrices with limited storage, Math. Comp. 1980","https://doi.org/10.1090/S0025-5718-1980-0572855-7"],
  ["Liu and Nocedal, On the limited memory BFGS method for large scale optimization, Math. Programming 1989","https://doi.org/10.1007/BF01589116"],
  ["Nocedal and Wright, Numerical Optimization, Chapter 7","https://link.springer.com/book/10.1007/978-0-387-40065-5"]]},

{id:"nelder-mead",title:"Nelder-Mead simplex method",level:3,kind:"Gradient-free",status:"Runnable teaching lab",
 summary:"Nelder-Mead maintains a simplex of n+1 points. It reflects, expands, contracts and shrinks to move toward the minimum. No gradients needed.",
 mental:"A flexible polygon that crawls downhill",
 mentalText:"Move the worst point of the simplex to a better location. Adapt the shape based on the function values.",
 steps:["Initialize n+1 points.","Order by function value.","Compute the centroid of the best n points.","Reflect the worst point through the centroid.","Based on the new value, expand, contract or shrink."],
 pseudo:"nelder_mead(f, x0, n):\n  simplex = initial_simplex(x0)\n  while not converged:\n    sort simplex by f\n    centroid = mean(simplex[:-1])\n    # reflection\n    x_r = centroid + alpha * (centroid - simplex[-1])\n    if f(simplex[0]) <= f(x_r) < f(simplex[-2]):\n      simplex[-1] = x_r\n    elif f(x_r) < f(simplex[0]):\n      # expansion\n      x_e = centroid + gamma * (x_r - centroid)\n      simplex[-1] = x_e if f(x_e) < f(x_r) else x_r\n    else:\n      # contraction\n      x_c = centroid + rho * (simplex[-1] - centroid)\n      if f(x_c) < f(simplex[-1]):\n        simplex[-1] = x_c\n      else:\n        # shrink\n        for i in range(1, n + 1):\n          simplex[i] = simplex[0] + sigma * (simplex[i] - simplex[0])\n  return simplex[0]\n\nStandard parameters:\n  alpha = 1 (reflection)\n  gamma = 2 (expansion)\n  rho = 0.5 (contraction)\n  sigma = 0.5 (shrink)\n\nConvergence: no guarantee, but works in practice.",
 uses:"Black-box optimization, hyperparameter tuning, small-dimensional problems.",
 strength:"No gradients needed. Simple. Robust on small problems.",
 limits:"Slow convergence. No theoretical guarantee.",
 pitfall:"Nelder-Mead can converge to non-stationary points. Not reliable for high-precision.",
 question:"How many points does the Nelder-Mead simplex have in n dimensions?",
 answer:"n + 1. One more than the dimension.",
 demo:"nelder-mead",sample:"2",refs:[
  ["Nelder and Mead, A simplex method for function minimization, Computer Journal 1965","https://doi.org/10.1093/comjnl/7.4.308"],
  ["Lagarias et al., Convergence properties of the Nelder-Mead simplex method in low dimensions, SIAM J. Optim. 1998","https://doi.org/10.1137/S1052623496303470"],
  ["Kochenderfer and Wheeler, Algorithms for Optimization, MIT Press 2019","https://mitpress.mit.edu/9780262039420/algorithms-for-optimization/"]]},
{id:"powell",title:"Powell's method",level:4,kind:"Gradient-free",status:"Concept lesson",
 summary:"Powell's method minimizes a function by solving a sequence of 1D line searches along conjugate directions. No gradients, and it can be more efficient than Nelder-Mead.",
 mental:"Search along a set of directions one at a time",
 mentalText:"Minimize along direction 1, then direction 2, then update the direction set with the net displacement. Repeat.",
 steps:["Initialize directions as the coordinate axes.","For each direction, do a 1D line search.","Replace one direction with the direction of net progress.","Repeat."],
 pseudo:"powell(f, x0, n):\n  x = x0\n  directions = [e_i for i in range(n)]\n  while not converged:\n    x_start = x\n    for d in directions:\n      alpha = line_search(f, x, d)\n      x = x + alpha * d\n    # new direction is net displacement\n    new_dir = x - x_start\n    directions.pop(0)\n    directions.append(new_dir)\n  return x\n\nConvergence: quadratic for smooth functions\nFails when the new direction is linearly dependent on the previous set",
 uses:"Black-box optimization without gradients, small to medium dimensions.",
 strength:"Efficient gradient-free method. Fast convergence for smooth functions.",
 limits:"Can fail when directions become linearly dependent.",
 pitfall:"The basic version fails when the direction set becomes degenerate. Sorenson-Wilson variant fixes this.",
 question:"Why does Powell's method need conjugate directions?",
 answer:"Conjugate directions decouple the problem. Each 1D search along a conjugate direction does not undo previous progress.",
 demo:"none",sample:"",refs:[
  ["Powell, An efficient method for finding the minimum of a function of several variables without calculating derivatives, Computer Journal 1964","https://doi.org/10.1093/comjnl/7.2.155"],
  ["Press et al., Numerical Recipes, Section 10.5","http://numerical.recipes/"],
  ["Kochenderfer and Wheeler, Algorithms for Optimization, MIT Press 2019","https://mitpress.mit.edu/9780262039420/algorithms-for-optimization/"]]},
{id:"cma-es",title:"CMA-ES",level:5,kind:"Evolutionary",status:"Concept lesson",
 summary:"The Covariance Matrix Adaptation Evolution Strategy samples from a multivariate normal, adapts the mean and covariance to follow the best directions, and scales to moderate dimensions.",
 mental:"Adapt the search distribution to the shape of the problem",
 mentalText:"Sample a population. Take a weighted mean of the best samples. Update the covariance matrix using the directions of progress. Repeat.",
 steps:["Sample lambda points from N(m, sigma^2 C).","Evaluate and rank.","Update mean as a weighted mean of the best.","Update covariance using evolution paths.","Adapt step size.","Repeat."],
 pseudo:"cma_es(f, x0, sigma, N):\n  m = x0\n  C = I   # covariance\n  p_sigma = 0   # evolution path for step size\n  p_c = 0   # evolution path for covariance\n  while not converged:\n    samples = [m + sigma * chol(C) @ z for z in randn(lambda, N)]\n    fitness = [f(s) for s in samples]\n    order = argsort(fitness)\n    m = sum(w_i * samples[order[i]] for i in range(mu))\n    # update p_sigma and p_c\n    p_sigma = (1 - c_sigma) p_sigma + sqrt(c_sigma (2 - c_sigma) mu_eff) * C^(-1/2) (m - m_old) / sigma\n    p_c = (1 - c_c) p_c + ...\n    # update C\n    C = (1 - c1 - c_mu) C + c1 * p_c p_c^T + c_mu * sum(w_i y_i y_i^T)\n    # update sigma\n    sigma *= exp((c_sigma / d_sigma) * (norm(p_sigma) / E_norm - 1))\n  return m\n\nHyperparameters usually work well at defaults.",
 uses:"Black-box optimization, hyperparameter tuning, reinforcement learning, robotics.",
 strength:"Adapts to the problem's shape. Robust to noise. Handles non-separable problems.",
 limits:"O(n^2) or more per sample. Scales to n ~ 1000.",
 pitfall:"Starting sigma too large wastes samples. Too small and it may get stuck.",
 question:"What makes CMA-ES different from a standard evolution strategy?",
 answer:"CMA-ES adapts the full covariance matrix of the sampling distribution, capturing the shape of the problem. Standard ES uses an isotropic Gaussian.",
 demo:"none",sample:"",refs:[
  ["Hansen and Ostermeier, Completely derandomized self-adaptation in evolution strategies, Evolutionary Computation 2001","https://doi.org/10.1162/106365601750190398"],
  ["Hansen, The CMA Evolution Strategy: A Tutorial, 2016","https://arxiv.org/abs/1604.00772"],
  ["CMA-ES official page","https://www.cma-es.github.io/"]]},
{id:"diff-evolution",title:"Differential evolution",level:4,kind:"Evolutionary",status:"Concept lesson",
 summary:"Differential evolution mutates each individual with the difference of two others, then crosses over with the original. Simple, robust, gradient-free.",
 mental:"Vector differences drive the mutation",
 mentalText:"For each individual, pick three others. Add the difference of two to the third. Cross over with the target. Keep the better.",
 steps:["Initialize a population.","For each individual:","Pick three random others a, b, c.","Mutant = a + F * (b - c).","Cross over with the target to get the trial.","Select the better of target and trial."],

 "li-chao":{python:`# Li Chao tree for the minimum of lines over integer x in [lo, hi]
class LiChao:
    def __init__(self, lo, hi):
        self.lo = lo
        self.hi = hi
        self.tree = {}
    def add_line(self, m, b, node=1, l=None, r=None):
        if l is None: l, r = self.lo, self.hi
        if node not in self.tree:
            self.tree[node] = (m, b); return
        cm, cb = self.tree[node]
        mid = (l + r) // 2
        # ensure the new line is better at mid
        if m * mid + b < cm * mid + cb:
            self.tree[node], (m, b) = (m, b), (cm, cb)
            cm, cb = self.tree[node]
        if l == r: return
        if m * l + b < cm * l + cb:
            self.add_line(m, b, 2*node, l, mid)
        elif m * r + b < cm * r + cb:
            self.add_line(m, b, 2*node+1, mid+1, r)
    def query(self, x, node=1, l=None, r=None):
        if l is None: l, r = self.lo, self.hi
        if node not in self.tree: return float('inf')
        cm, cb = self.tree[node]
        best = cm * x + cb
        if l == r: return best
        mid = (l + r) // 2
        if x <= mid:
            return min(best, self.query(x, 2*node, l, mid))
        else:
            return min(best, self.query(x, 2*node+1, mid+1, r))

lt = LiChao(-10, 10)
lt.add_line(2, 3)
lt.add_line(1, 5)
lt.add_line(-1, 10)
for x in [-5, 0, 5, 10]:
    print(x, lt.query(x))

 "mitm":{python:`from bisect import bisect_right

def subset_sum_mitm(nums, target):
    n = len(nums)
    half = n // 2
    left = [0]
    for x in nums[:half]:
        left += [s + x for s in left]
    right = [0]
    for x in nums[half:]:
        right += [s + x for s in right]
    right.sort()
    best = 0
    for s in left:
        idx = bisect_right(right, target - s) - 1
        if idx >= 0:
            best = max(best, s + right[idx])
    return best

from collections import Counter

def huffman(freqs):
    heap = [[f, [s, '']] for s, f in freqs.items()]
    heapq.heapify(heap)
    while len(heap) > 1:
        lo = heapq.heappop(heap)
        hi = heapq.heappop(heap)
        for pair in lo[1:]:
            pair[1] = '0' + pair[1]
        for pair in hi[1:]:
            pair[1] = '1' + pair[1]
        heapq.heappush(heap, [lo[0] + hi[0]] + lo[1:] + hi[1:])

    solutions = []
    def backtrack(row, cols, diag1, diag2, board):
        if row == n:
            solutions.append(board[:])
            return
        for col in range(n):
            if col in cols or (row + col) in diag1 or (row - col) in diag2:
                continue
            cols.add(col); diag1.add(row + col); diag2.add(row - col)
            board.append(col)
            backtrack(row + 1, cols, diag1, diag2, board)
            board.pop(); cols.remove(col); diag1.remove(row + col); diag2.remove(row - col)
    backtrack(0, set(), set(), set(), [])

 "branch-bound":{python:`import heapq

def knapsack_bb(items, W):
    items = sorted(items, key=lambda x: -x[1]/x[0])  # by value/weight
    n = len(items)
    best = [0]
    def bound(i, w, v):
        # fractional knapsack bound
        result = v
        total_w = w
        j = i
        while j < n and total_w + items[j][0] <= W:
            total_w += items[j][0]
            result += items[j][1]
            j += 1
        if j < n:
            result += (W - total_w) * items[j][1] / items[j][0]
        return result
    def search(i, w, v):
        if w > W: return
        if i == n:
            best[0] = max(best[0], v); return
        if bound(i, w, v) <= best[0]: return
        # take item i
        search(i+1, w + items[i][0], v + items[i][1])
        # skip item i
        search(i+1, w, v)
    search(0, 0, 0)
    return best[0]

 "a-star":{python:`import heapq

def a_star(grid, start, goal):
    def h(p):
        return abs(p[0] - goal[0]) + abs(p[1] - goal[1])
    R, C = len(grid), len(grid[0])
    open_set = [(h(start), 0, start, [start])]
    closed = set()
    while open_set:
        f, g, cur, path = heapq.heappop(open_set)
        if cur == goal:
            return g, path
        if cur in closed: continue
        closed.add(cur)
        for dx, dy in [(1,0),(-1,0),(0,1),(0,-1)]:
            nx, ny = cur[0]+dx, cur[1]+dy
            if 0 <= nx < R and 0 <= ny < C and grid[nx][ny] == 0 and (nx,ny) not in closed:
                ng = g + 1
                heapq.heappush(open_set, (ng + h((nx,ny)), ng, (nx,ny), path + [(nx,ny)]))
    return None

 "bfgs":{python:`import numpy as np

# Minimize Rosenbrock function
def f(x):
    return (1 - x[0])**2 + 100*(x[1] - x[0]**2)**2

def grad(x):
    return np.array([
        -2*(1 - x[0]) - 400*x[0]*(x[1] - x[0]**2),
        200*(x[1] - x[0]**2)
    ])

def bfgs(f, grad, x0, tol=1e-6, max_iter=200):
    x = np.array(x0, dtype=float)
    B = np.eye(len(x))
    for _ in range(max_iter):
        g = grad(x)
        if np.linalg.norm(g) < tol: break
        d = -B @ g
        # simple backtracking line search
        alpha = 1.0
        while f(x + alpha * d) > f(x) + 1e-4 * alpha * (g @ d):
            alpha *= 0.5
            if alpha < 1e-12: break
        s = alpha * d
        x_new = x + s
        y = grad(x_new) - g
        rho = 1.0 / (y @ s)
        I = np.eye(len(x))
        B = (I - rho * np.outer(s, y)) @ B @ (I - rho * np.outer(y, s)) + rho * np.outer(s, s)
        x = x_new
    return x

print("true minimum: [1, 1]")

 "nelder-mead":{python:`import numpy as np

def nelder_mead(f, x0, sigma=0.5, tol=1e-6, max_iter=1000):
    n = len(x0)
    simplex = [np.array(x0, dtype=float)]
    for i in range(n):
        p = np.array(x0, dtype=float)
        p[i] += sigma
        simplex.append(p)
    simplex = np.array(simplex)
    alpha, gamma, rho, sig = 1.0, 2.0, 0.5, 0.5
    for _ in range(max_iter):
        order = np.argsort([f(p) for p in simplex])
        simplex = simplex[order]
        if np.linalg.norm(simplex[-1] - simplex[0]) < tol: break
        centroid = simplex[:-1].mean(axis=0)
        x_r = centroid + alpha * (centroid - simplex[-1])
        if f(simplex[0]) <= f(x_r) < f(simplex[-2]):
            simplex[-1] = x_r
        elif f(x_r) < f(simplex[0]):
            x_e = centroid + gamma * (x_r - centroid)
            simplex[-1] = x_e if f(x_e) < f(x_r) else x_r
        else:
            x_c = centroid + rho * (simplex[-1] - centroid)
            if f(x_c) < f(simplex[-1]):
                simplex[-1] = x_c
            else:
                for i in range(1, n+1):
                    simplex[i] = simplex[0] + sig * (simplex[i] - simplex[0])
    return simplex[0]

# Rosenbrock again

 while(heap.length>1){
  const a=heap.shift(),b=heap.shift();
  for(const x of a.syms)x.code='0'+x.code;
  for(const x of b.syms)x.code='1'+x.code;
  heap.push({f:a.f+b.f,syms:[...a.syms,...b.syms]});

 const avg=codes.reduce((s,x)=>s+x.code.length*freqs[x.s],0)/totalW;

  decoded:`Huffman coding builds an optimal prefix code by repeatedly merging the two least frequent symbols. The resulting code has minimum expected length among prefix codes.`
 };
}

  const p=lines[i].split(/\s+/).map(Number);
  if(p.length===3)constraints.push(p);

 // brute force over the vertex intersections
 let best=-Infinity,bestX=null;

 for(let i=0;i<constraints.length;i++)for(let j=i+1;j<constraints.length;j++){
  const[a1,b1,c1]=constraints[i],[a2,b2,c2]=constraints[j];
  const det=a1*b2-a2*b1;

 };

 const rng=(function(){let s=42;return()=>{s=(s*1103515245+12345)&0x7fffffff;return (s/0x7fffffff)*2-1}})();
 const data=[];
 for(let i=0;i<n;i++){const x=rng()*2;data.push([x,3*x+1+rng()*0.5])}
 for(let e=0;e<epochs;e++){
  for(const[x,y]of data){
   const pred=w*x+b;
   const err=pred-y;
   w-=lr*2*err*x;
   b-=lr*2*err;
  }
 }
 return {
  encoded:`Samples: ${n}\nEpochs: ${epochs}\nLearning rate: ${lr}\n\nFinal w: ${fmtNum(w,4)}  (true 3)\nFinal b: ${fmtNum(b,4)}  (true 1)`,
  decoded:`SGD on 1D linear regression. Each step uses one sample. Converges to the true slope and intercept.`
 };
}
function demoMomentum(text){
 const lines=text.trim().split(/\n/);
 const lr=parseFloat(lines[0])||0.05;
 const maxIter=parseInt(lines[1])||50;
 const beta=0.9;
 const f=x=>x*x+3*x+5;
 const grad=x=>2*x+3;
 let x=10,v=0;
 const traj=[[x,f(x)]];
 for(let i=0;i<maxIter;i++){v=beta*v+grad(x);x-=lr*v;traj.push([x,f(x)])}
 return {
  encoded:`Learning rate: ${lr}, beta: ${beta}\nIterations: ${maxIter}\n\nFinal x: ${fmtNum(x,6)}\nFinal f(x): ${fmtNum(f(x),6)}\nTrue minimum: x = -1.5`,
  html:plotSVG(f,-5,10,-1,80,traj,700,220),
  decoded:`Momentum accumulates past gradients to smooth and accelerate. The green dots show the trajectory.`
 };
}
function demoNewton(text){
 const n=parseInt(text.trim())||2;
 // f(x) = x^4 - 3x^3 + 2
 const f=x=>x**4-3*x**3+2;
 const fp=x=>4*x**3-9*x**2;
 const fpp=x=>12*x**2-18*x;
 let x=3.0;
 const traj=[[x,f(x)]];
 for(let i=0;i<8;i++){
  const d=fp(x)/fpp(x);
  x=x-d;
  traj.push([x,f(x)]);
 }
 return {
  encoded:`f(x) = x^4 - 3x^3 + 2\nStart: x = 3\nIterations: 8\n\nFinal x: ${fmtNum(x,8)}\nf(x): ${fmtNum(f(x),8)}`,
  html:plotSVG(f,0,3,0,20,traj,700,220),
  decoded:`Newton's method converges quadratically near the optimum. Each iteration solves the local quadratic model exactly.`
 };
}
function demoBfgs(text){
 const n=parseInt(text.trim())||2;
 // Rosenbrock
 const f=x=>(1-x[0])**2+100*(x[1]-x[0]**2)**2;
 const grad=x=>[-2*(1-x[0])-400*x[0]*(x[1]-x[0]**2),200*(x[1]-x[0]**2)];
 let x=[-1.2,1.0];
 let B=[[1,0],[0,1]];
 const traj=[[x[0],x[1]]];
 for(let i=0;i<80;i++){
  const g=grad(x);
  const d=[-(B[0][0]*g[0]+B[0][1]*g[1]),-(B[1][0]*g[0]+B[1][1]*g[1])];
  let alpha=1;
  for(let j=0;j<30;j++){
   const xp=[x[0]+alpha*d[0],x[1]+alpha*d[1]];
   if(f(xp)<=f(x)+1e-4*alpha*(g[0]*d[0]+g[1]*d[1]))break;
   alpha*=0.5;
  }
  const s=[alpha*d[0],alpha*d[1]];
  const xn=[x[0]+s[0],x[1]+s[1]];
  const gn=grad(xn);
  const y=[gn[0]-g[0],gn[1]-g[1]];
  const sy=s[0]*y[0]+s[1]*y[1];
  if(sy>1e-12){
   const rho=1/sy;
   const I=[[1,0],[0,1]];
   const A=[[I[0][0]-rho*s[0]*y[0],I[0][1]-rho*s[0]*y[1]],[I[1][0]-rho*s[1]*y[0],I[1][1]-rho*s[1]*y[1]]];
   const B1=[[A[0][0]*B[0][0]+A[0][1]*B[1][0],A[0][0]*B[0][1]+A[0][1]*B[1][1]],[A[1][0]*B[0][0]+A[1][1]*B[1][0],A[1][0]*B[0][1]+A[1][1]*B[1][1]]];
   const At=[[A[0][0],A[1][0]],[A[0][1],A[1][1]]];
   const B2=[[B1[0][0]*At[0][0]+B1[0][1]*At[1][0],B1[0][0]*At[0][1]+B1[0][1]*At[1][1]],[B1[1][0]*At[0][0]+B1[1][1]*At[1][0],B1[1][0]*At[0][1]+B1[1][1]*At[1][1]]];
   const ss=[[rho*s[0]*s[0],rho*s[0]*s[1]],[rho*s[1]*s[0],rho*s[1]*s[1]]];
   B=[[B2[0][0]+ss[0][0],B2[0][1]+ss[0][1]],[B2[1][0]+ss[1][0],B2[1][1]+ss[1][1]]];
  }
  x=xn;
  traj.push([x[0],x[1]]);
  if(Math.hypot(g[0],g[1])<1e-6)break;
 }
 return {
  encoded:`Rosenbrock function\nStart: (-1.2, 1.0)\n\nFinal: (${x.map(v=>fmtNum(v,6)).join(', ')})\nTrue minimum: (1, 1)\nf(x): ${fmtNum(f(x),8)}`,
  html:scatterSVG(traj,700,220),
  decoded:`BFGS uses a quasi-Newton update to the inverse Hessian. The trajectory (green dots) shows progress through the Rosenbrock valley.`
 };
}
function demoNelderMead(text){
 const n=parseInt(text.trim())||2;
 const f=x=>(1-x[0])**2+100*(x[1]-x[0]**2)**2;
 // simplified Nelder-Mead
 let simplex=[[-1.2,1.0],[-1.0,1.0],[-1.2,1.2]];
 for(let iter=0;iter<200;iter++){
  simplex.sort((a,b)=>f(a)-f(b));
  const centroid=[(simplex[0][0]+simplex[1][0])/2,(simplex[0][1]+simplex[1][1])/2];
  const xr=[centroid[0]+(centroid[0]-simplex[2][0]),centroid[1]+(centroid[1]-simplex[2][1])];
  if(f(xr)<f(simplex[0])){
   const xe=[centroid[0]+2*(xr[0]-centroid[0]),centroid[1]+2*(xr[1]-centroid[1])];
   simplex[2]=f(xe)<f(xr)?xe:xr;
  }else if(f(xr)<f(simplex[1])){
   simplex[2]=xr;
  }else{
   const xc=[centroid[0]+0.5*(simplex[2][0]-centroid[0]),centroid[1]+0.5*(simplex[2][1]-centroid[1])];
   if(f(xc)<f(simplex[2]))simplex[2]=xc;
   else{
    for(let i=1;i<3;i++)simplex[i]=[simplex[0][0]+0.5*(simplex[i][0]-simplex[0][0]),simplex[0][1]+0.5*(simplex[i][1]-simplex[0][1])];
   }
  }
 }
 simplex.sort((a,b)=>f(a)-f(b));
 return {
  encoded:`Rosenbrock function, Nelder-Mead\nStart: (-1.2, 1.0)\n\nFinal: (${simplex[0].map(v=>fmtNum(v,6)).join(', ')})\nTrue minimum: (1, 1)\nf(x): ${fmtNum(f(simplex[0]),8)}`,
  decoded:`Nelder-Mead simplex method. Reflects the worst point, expands or contracts based on the result.`
 };
}
function demoPareto(text){
 const lines=text.trim().split(/\n/).filter(Boolean);
 const points=lines.map(l=>l.split(/\s+/).map(Number));
 const front=[];
 for(let i=0;i<points.length;i++){
  let dominated=false;
  for(let j=0;j<points.length;j++){
   if(i===j)continue;
   if(points[j].every((v,k)=>v<=points[i][k])&&points[j].some((v,k)=>v<points[i][k])){dominated=true;break}
  }
  if(!dominated)front.push(points[i]);
 }
 return {
  encoded:`Points: ${points.map(p=>`(${p.join(',')})`).join(', ')}\n\nPareto front:\n${front.map(p=>`  (${p.join(', ')})`).join('\n')}`,
  html:scatterSVG(points,700,220),
  decoded:`The Pareto front contains all non-dominated points. No other point is at least as good in all objectives and strictly better in one.`
 };
}

<div class="stats"><div class="stat"><strong>${CHAPTERS.length}</strong><span>chapters</span></div><div class="stat"><strong>${LESSONS.length}</strong><span>lessons</span></div><div class="stat"><strong>${LESSONS.filter(l=>l.demo&&l.demo!=='none').length}</strong><span>runnable labs</span></div><div class="stat"><strong>1</strong><span>standalone file</span></div></div>
<section class="panel"><div class="panel-head"><h2>Honest scope</h2><p>One app covers the whole curriculum. Production optimization software is a separate engineering project.</p></div><div class="body two"><div class="mini"><h3>What runs here</h3><p>Overlapping subproblems demo, memoized grid paths, bottom-up knapsack, Fibonacci, climbing stairs, grid paths, edit distance, LCS, 0/1 knapsack, unbounded knapsack (coin change), bitset subset sum, bitmask TSP, SOS DP, LIS (patience sorting), Kadane, matrix chain, partition DP, prefix sums, monotonic queue, CHT demo, Li Chao tree, meet-in-the-middle, activity selection, Huffman coding, interval scheduling, N-queens backtracking, branch and bound for knapsack, LP vertex enumeration, assignment by brute force, gradient descent, SGD, momentum, Newton, BFGS on Rosenbrock, Nelder-Mead, and Pareto front extraction.</p></div><div class="mini"><h3>What does not run here</h3><p>Production implementations of divide-and-conquer optimization, Knuth optimization, SMAWK, slope trick, Aliens trick, matroid intersection, full branch-and-cut, interior point, ellipsoid, network simplex, min-cost flow, Hungarian algorithm for large n, CMA-ES, differential evolution, Bayesian optimization, NSGA-II, PTAS/FPTAS, LP rounding. For real work use NumPy, SciPy, CVXPY, OR-Tools, Gurobi, CPLEX, or another vetted library.</p></div></div></section>
<div class="panel"><div class="panel-head"><h2>Course map</h2><p>Pick a chapter. The path runs from DP foundations to multi-objective optimization.</p></div><div class="body"><div class="chapter-cards">${CHAPTERS.map((c,i)=>`<button class="chapter-card" type="button" data-chapter="${c.id}"><span class="num">CHAPTER ${String(i+1).padStart(2,'0')} · ${c.ids.length} LESSONS</span><strong>${esc(c.title.replace(/^\d+\.\s*/,''))}</strong><p>${esc(c.desc)}</p></button>`).join('')}</div></div></div>
<footer class="footer"><span>Az DP &amp; Optimization Lab</span><span>Single file · no external runtime dependencies</span></footer>`;
 $('#startFirst').onclick=()=>openLesson('overlapping');
 $('#resumeLesson').onclick=()=>openLesson(state.current&&byId[state.current]?state.current:'overlapping');
 $('#mainView').querySelectorAll('[data-chapter]').forEach(b=>b.onclick=()=>{const c=CHAPTERS.find(x=>x.id===b.dataset.chapter);if(c)openLesson(c.ids[0])});
}

function renderProgressPage(){
 state.page='progress';
 $('#mainView').innerHTML=`<div class="breadcrumb">DP &amp; Optimization Lab / Bookmarks & progress</div><header class="header"><div class="eyebrow">LOCAL ONLY</div><h1>Bookmarks and progress</h1><p>Your progress stays in this browser. Export the JSON to move it or keep a backup.</p></header>
<section class="panel"><div class="panel-head"><h2>Completed lessons</h2></div><div class="body">${state.completed.size?`<div class="references">${[...state.completed].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No lessons marked complete yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Bookmarks</h2></div><div class="body">${state.bookmarks.size?`<div class="references">${[...state.bookmarks].map(id=>`<a href="#${id}" data-open="${id}">${esc(byId[id].title)}</a>`).join('')}</div>`:'<p class="muted">No bookmarks yet.</p>'}</div></section>
<section class="panel"><div class="panel-head"><h2>Progress data</h2></div><div class="body"><div class="header-actions" style="margin:0"><button class="btn primary" id="exportProgress" type="button">Export progress JSON</button><button class="btn" id="clearProgress" type="button">Clear completion marks</button></div><p class="muted" style="font-size:11.5px;margin-top:12px">Import accepts only known lesson IDs and a supported schema version.</p></div></section>`;
 $('#mainView').querySelectorAll('[data-open]').forEach(a=>a.onclick=e=>{e.preventDefault();openLesson(a.dataset.open)});
 $('#exportProgress').onclick=exportProgress;
 $('#clearProgress').onclick=()=>{if(confirm('Clear all completion marks?')){state.completed.clear();save();renderProgressPage();renderTree();toast('Completion marks cleared')}};
}

function openLesson(id){if(!byId[id])return;renderLesson(id);renderTree();$('#mainView').focus({preventScroll:true});window.scrollTo(0,0)}
function downloadText(name,text,type='text/plain'){const blob=new Blob([text],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),800)}
function exportProgress(){downloadText('az-dp-opt-lab-progress.json',JSON.stringify({schemaVersion:1,completed:[...state.completed],bookmarks:[...state.bookmarks],theme:state.theme,current:state.current,drafts:state.drafts},null,2),'application/json');toast('Progress exported')}
function importProgressFile(file){
 if(file.size>2_000_000){toast('Import rejected: file too large');return}
 const r=new FileReader();
 r.onload=()=>{try{
  const d=JSON.parse(r.result);
  if(!d||d.schemaVersion!==1||!Array.isArray(d.completed)||!Array.isArray(d.bookmarks)||typeof d.drafts!=='object')throw Error('bad schema');
  if([...d.completed,...d.bookmarks].some(id=>typeof id!=='string'||!byId[id]))throw Error('unknown id');
  state.completed=new Set(d.completed);
  state.bookmarks=new Set(d.bookmarks);
  state.theme=['system','light','dark'].includes(d.theme)?d.theme:'system';
  state.current=byId[d.current]?d.current:null;
  state.drafts=Object.fromEntries(Object.entries(d.drafts).filter(([k,v])=>byId[k]&&typeof v==='string'&&v.length<100000));
  applyTheme();save();renderTree();
  state.current?openLesson(state.current):renderHome();
  toast('Progress imported');
 }catch(e){toast('Import rejected: invalid progress data')}};
 r.readAsText(file);
}

function bindGlobal(){
 $('#themeSelect').onchange=()=>{state.theme=$('#themeSelect').value;applyTheme();save()};
 $('#printBtn').onclick=()=>print();
 $('#exportBtn').onclick=exportProgress;
 $('#importBtn').onclick=()=>$('#importFile').click();
 $('#importFile').onchange=e=>{if(e.target.files[0])importProgressFile(e.target.files[0]);e.target.value=''};
 $('#searchInput').oninput=renderTree;
 $('#chapterFilter').onchange=renderTree;
 $('#homeLink').onclick=e=>{e.preventDefault();renderHome();history.replaceState(null,'','#home')};
 $('#courseTree').onclick=e=>{const b=e.target.closest('[data-lesson]');if(b)openLesson(b.dataset.lesson)};
 document.querySelectorAll('[data-page="home"]').forEach(b=>b.onclick=renderHome);
 document.querySelectorAll('[data-page="progress"]').forEach(b=>b.onclick=renderProgressPage);
 document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){e.preventDefault();$('#searchInput').focus()}
  if(e.key.toLowerCase()==='t'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){
   state.theme=state.theme==='dark'?'light':state.theme==='light'?'system':'dark';
   applyTheme();save();
  }
 });
}

function init(){
 load();
 applyTheme();
 CHAPTERS.forEach(c=>{const op=document.createElement('option');op.value=c.id;op.textContent=c.title;$('#chapterFilter').append(op)});
 bindGlobal();
 renderTree();
 const hash=location.hash.replace(/^#/,'');
 if(hash&&byId[hash])renderLesson(hash);
 else if(state.current&&byId[state.current])renderLesson(state.current);
 else renderHome();
 progress();
}
init();
</script>
</body>
</html>
